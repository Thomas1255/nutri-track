project_id = "nutri-track"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "https://nutri-track-mu-seven.vercel.app"
additional_redirect_urls = ["http://127.0.0.1:5173/login", "http://localhost:5173/login", "http://127.0.0.1:4173/login", "http://localhost:4173/login", "https://nutri-track-mu-seven.vercel.app/login", "https://nutri-track-test1117.vercel.app/login"]
minimum_password_length = 12

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[functions.food-search]
verify_jwt = true
